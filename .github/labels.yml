# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Something fails, crashes, leaks or returns a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something the driver should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A wrong value, or rows lost or doubled"
- name: "impact/crash"
  color: "#b60205"
  description: "A crash, abort, hang or leak"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/codec"
  color: "#c5def5"
  description: "Values over turborel-c's codec: decimal, datetimes, JSON, UUID"
- name: "area/transport"
  color: "#c5def5"
  description: "Connections over TCP, Unix sockets, named pipes"
- name: "area/auth"
  color: "#c5def5"
  description: "Mechanisms of authentication, SCRAM"
- name: "area/tls"
  color: "#c5def5"
  description: "TLS by mode, channel binding"
- name: "area/session"
  color: "#c5def5"
  description: "The connection's session: status, notices, errors, cancel"
- name: "area/statements"
  color: "#c5def5"
  description: "Queries, prepared statements, cursors, rows"
- name: "area/lobs"
  color: "#c5def5"
  description: "Large objects by locator"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "The URI, options, variables, service and password files"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines of requests"
- name: "area/pool"
  color: "#c5def5"
  description: "Pools of connections, the SQL-agent"
- name: "area/api"
  color: "#c5def5"
  description: "The public headers as a whole"
- name: "area/test"
  color: "#c5def5"
  description: "The tests"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms, labels and Dependabot in .github/"
- name: "area/build"
  color: "#c5def5"
  description: "CMake, presets, the lint and format configs"
- name: "dependencies"
  color: "#0366d6"
  description: "A dependency or a pinned tool changes (R-DEP-1, R-DEP-3)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
