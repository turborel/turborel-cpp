# Builds and checks a release, run by hand only (RULES.md D14). It builds
# and tests the Release preset on each platform, installs it, and keeps
# each install and the source archive as the run's artifacts. It publishes
# nothing: its last step is written but off, and the owner turns it on once
# every turborel driver is done (VERSIONING.md, Publishing).
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: cmake --workflow --preset release
      - name: Install
        run: cmake --install build/release --prefix stage --config Release
      - name: Pack the install
        run: cmake -E tar cf turborel-cpp-${{ runner.os }}.zip --format=zip stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turborel-cpp-${{ runner.os }}
          path: turborel-cpp-${{ runner.os }}.zip

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack the source
        run: git archive --format=tar.gz --prefix=turborel-cpp/ -o turborel-cpp-source.tar.gz HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turborel-cpp-source
          path: turborel-cpp-source.tar.gz

  publish:
    needs: [build, source]
    # Off until the owner publishes the turborel drivers together; the owner
    # turns it on by removing this condition.
    if: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(grep -m1 -oE 'VERSION [0-9.]+' CMakeLists.txt | cut -d' ' -f2)" dist/* --title "turborel-cpp" --generate-notes
