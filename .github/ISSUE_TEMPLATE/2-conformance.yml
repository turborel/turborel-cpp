name: Conformance
description: The driver departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row marked "not yet" is open work, not a departure.
        The spec is turborel's doc/client/05-protocol.md; turborel-client is described in doc/client/02-library.md and 02-library-connections.md. Where the spec and turborel-client differ, turborel-client is right.
  - type: dropdown
    id: source
    attributes:
      label: Departs from
      options:
        - The protocol spec (05-protocol.md)
        - turborel-client (02-library.md or 02-library-connections.md)
    validations:
      required: true
  - type: input
    id: heading
    attributes:
      label: Where it says so
      description: The heading of the section, as printed, e.g. "Composite fields", "Pipelines".
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the passage, or show what turborel-client does.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest program, and the SQL that sets up its database, that shows the departure.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the driver does
      description: Its result, or its error's SQLCODE, SQLSTATE and message.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
