name: Feature
description: Something the driver should do that it does not.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check TODO.md and CONFORMANCE.md first: it may be planned already.
        The driver matches turborel-client; a feature turborel-client lacks belongs in turborel first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you need to do, and why the driver cannot do it today, or not well.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Something turborel-client does that the driver does not
        - The C++ API (ranges, chrono, decimal, RAII)
        - Building, packaging or installing
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would work, and the classes, functions or CMake options it would add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else would solve the problem, and why this is better.
