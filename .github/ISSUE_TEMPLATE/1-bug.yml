name: Bug
description: Something fails, crashes, leaks, or returns a wrong value.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        Put a severe impact first in the title: `[WRONG RESULT]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Wrong value, or rows lost or doubled
        - Crash, abort, hang or leak
        - Wrong error, SQLCODE or SQLSTATE
        - Does not build
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest program that shows it, and the SQL that sets up the database it connects to.
        Say how it connects (TCP, Unix socket or named pipe, TLS or not) and as which mechanism.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the protocol's heading or turborel-client's behaviour if they say, e.g. `[PROTOCOL Composite fields]`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the error's `what()`, SQLCODE and SQLSTATE, and the sanitizer report or backtrace if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD` of turborel-cpp, and of turborel-c if you built it yourself"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The server's version, as `turboreld --version` prints it, or its commit.
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler
      description: The compiler and its version, the standard library, and the build type, e.g. "GCC 14.2, libstdc++, Debug".
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How often it happens, what you ruled out.
